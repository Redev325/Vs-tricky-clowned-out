name: Inspect Tricky Clowned Out scripts

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-mod.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inspect release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p extracted report
          gh release download v1.0.0 --repo "${GITHUB_REPOSITORY}" --pattern "TrickyClownedOut.zip" --dir .
          unzip -q TrickyClownedOut.zip -d extracted
          MOD_DIR="$(dirname "$(find extracted -type f -name '_polymod_meta.json' -print -quit)")"
          echo "MOD_DIR=$MOD_DIR"

          for f in \
            "_polymod_meta.json" \
            "scripts/import.hx" \
            "scripts/modules/import.hx" \
            "scripts/modules/TrickyMenuRedirectorModule.hxc" \
            "scripts/modules/TrickyMenuToggle.hxc" \
            "scripts/modules/TrickyPussyMode.hx" \
            "scripts/states/TrickyBootScreen.hxc" \
            "scripts/states/TrickyTitleState.hx" \
            "scripts/states/TrickyMenuState.hxc" \
            "scripts/states/TrickeyMobileChecker.hx"; do
            echo
            echo "===== $f ====="
            if [ -f "$MOD_DIR/$f" ]; then
              cat "$MOD_DIR/$f" | tee "report/$(basename "$f").txt"
            else
              echo "MISSING" | tee "report/$(basename "$f").txt"
            fi
          done

          echo "===== all module/state script names =====" | tee report/file-list.txt
          find "$MOD_DIR/scripts/modules" "$MOD_DIR/scripts/states" -type f -print | sort | tee -a report/file-list.txt
          cp "$MOD_DIR/_polymod_meta.json" report/_polymod_meta.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: tricky-menu-script-inspection
          path: report