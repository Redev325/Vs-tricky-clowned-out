name: Build Tricky Clowned Out HTML5

on:
  # README.md and other repository documentation changes must never replace
  # the published game site. The site is rebuilt only manually or from a
  # published game release. This workflow-file push trigger exists only so
  # workflow changes can rebuild the current game site.
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-html5.yml"
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Start diagnostics
        run: |
          set -u
          mkdir -p "$GITHUB_WORKSPACE/ci-logs"
          {
            echo "=== GitHub Actions diagnostic ==="
            date -u
            echo "Runner: $RUNNER_OS"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
          } | tee "$GITHUB_WORKSPACE/ci-logs/environment.txt"

      - name: Download Tricky Clowned Out mod
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh release download v1.0.0 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "TrickyClownedOut.zip" \
            --dir source 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/download.log"
          test -s source/TrickyClownedOut.zip
          ls -lh source/TrickyClownedOut.zip | tee -a "$GITHUB_WORKSPACE/ci-logs/download.log"

      - name: Extract and locate mod
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q source/TrickyClownedOut.zip -d extracted

          META="$(find extracted -type f -name '_polymod_meta.json' -print -quit || true)"
          if [ -z "$META" ]; then
            echo "::error::TrickyClownedOut.zip does not contain _polymod_meta.json"
            exit 1
          fi

          MOD_DIR="$(dirname "$META")"
          echo "Mod root: $MOD_DIR"
          echo "MOD_DIR=$MOD_DIR" >> "$GITHUB_ENV"

          python3 - "$META" <<'PY'
          import json
          import sys

          meta = sys.argv[1]
          with open(meta, "r", encoding="utf-8") as f:
              data = json.load(f)

          api = str(data.get("api_version", "")).strip()
          if not api:
              raise SystemExit("No api_version found in _polymod_meta.json")

          print(f"Detected FNF API version: {api}")

          with open("/tmp/fnf_version", "w", encoding="utf-8") as f:
              f.write(api)
          PY

          # The published Tricky Clowned Out base-game mod targets FNF 0.8.6.
          # The uploaded archive's metadata is 0.8.4, so do not downgrade the engine.
          echo "Mod metadata API: $(cat /tmp/fnf_version)"
          echo "FNF_VERSION=0.8.6" >> "$GITHUB_ENV"

          {
            echo "=== Mod inventory ==="
            echo "META=$META"
            echo "MOD_DIR=$MOD_DIR"
            echo "FNF_VERSION=$(cat /tmp/fnf_version)"
            find "$MOD_DIR" -maxdepth 2 -type f | head -n 100
          } | tee "$GITHUB_WORKSPACE/ci-logs/mod.txt"

      - name: Diagnose Tricky scripted modules
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/ci-logs/script-diagnostics.txt"
          {
            echo "=== Tricky scripted-module diagnostics ==="
            echo "MOD_DIR=$MOD_DIR"
            echo
            echo "=== References to onFocusLost ==="
            grep -Rni --include='*.hx' --include='*.hxc' "onFocusLost" "$MOD_DIR" || true
            echo
            echo "=== References to _constructor ==="
            grep -Rni --include='*.hx' --include='*.hxc' "_constructor" "$MOD_DIR" || true
            echo
            echo "=== Module scripts ==="
            find "$MOD_DIR/scripts/modules" -type f -maxdepth 2 -print 2>/dev/null | sort || true
            echo
            for file in "$MOD_DIR"/scripts/modules/*; do
              [ -f "$file" ] || continue
              echo "----- $file -----"
              sed -n '1,260p' "$file"
              echo
            done
          } | tee "$LOG"

      - name: Checkout matching Friday Night Funkin source
        run: |
          set -euo pipefail

          if [ -z "${FNF_VERSION:-}" ]; then
            echo "::error::FNF_VERSION was not detected from _polymod_meta.json"
            exit 1
          fi

          echo "=== Requested FNF API version: $FNF_VERSION ==="

          # A V-Slice mod targets a specific FNF API version. Use the
          # corresponding FNF release instead of the moving main branch.
          git clone --depth 1 --branch "v$FNF_VERSION" --recurse-submodules \
            https://github.com/FunkinCrew/Funkin.git funkin 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/checkout.log"

          test -f funkin/project.hxp
          test -d funkin/assets

          echo "=== Checked out FNF release ==="
          git -C funkin describe --tags --always | tee -a "$GITHUB_WORKSPACE/ci-logs/checkout.log"
          git -C funkin rev-parse HEAD | tee -a "$GITHUB_WORKSPACE/ci-logs/checkout.log"

      - name: Patch FNF script import aliases
        working-directory: funkin
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("source/funkin/modding/PolymodHandler.hx")
          text = path.read_text(encoding="utf-8")

          anchor = "  static function buildImports():Void\n  {"
          if anchor not in text:
              raise SystemExit("Could not find PolymodHandler.buildImports()")

          aliases = """\n    // Compatibility aliases for legacy mod scripts.\n    // These classes are present in the pinned FNF v0.8.7 dependencies,\n    // but explicit aliases make Polymod's HScript import resolver find them reliably.\n    Polymod.addImportAlias('flixel.util.FlxSort', flixel.util.FlxSort);\n    Polymod.addImportAlias('animate.internal.elements.FlxSpriteElement', animate.internal.elements.FlxSpriteElement);\n    Polymod.addImportAlias('funkin.util.TouchUtil', funkin.util.TouchUtil);\n    Polymod.addImportAlias('funkin.util.FlxTweenUtil', funkin.util.FlxTweenUtil);\n    // Tricky's module scripts use `extends Module`. Map that name to FNF's\n    // scriptable module bridge so HScript can legally extend it on HTML5.\n    Polymod.addImportAlias('Module', funkin.modding.module.ScriptedModule);\n    Polymod.addImportAlias('funkin.modding.module.Module', funkin.modding.module.ScriptedModule);\n"""

          if ("animate.internal.elements.FlxSpriteElement" not in text
              or "funkin.util.TouchUtil" not in text
              or "funkin.util.FlxTweenUtil" not in text):
              text = text.replace(anchor, anchor + aliases, 1)
              path.write_text(text, encoding="utf-8")
              print("Added HScript import aliases.")
          else:
              print("HScript import aliases already present.")

          # The browser crash occurs in SongEventRegistry when a class generated by
          # ClassMacro cannot be resolved by the HTML5 runtime. Patch the registry
          # itself so unresolved entries are logged and skipped instead of crashing.
          registry = Path("source/funkin/data/event/SongEventRegistry.hx")
          registry_text = registry.read_text(encoding="utf-8")
          registry_anchor = "    for (eventCls in BUILTIN_EVENTS)\n    {\n      var eventClsName:String = Type.getClassName(eventCls);"
          registry_guard = "    for (eventCls in BUILTIN_EVENTS)\n    {\n      if (eventCls == null)\n      {\n        trace(' WARNING: Skipping unresolved built-in song event class in HTML5 runtime.');\n        continue;\n      }\n      var eventClsName:String = Type.getClassName(eventCls);"
          if registry_anchor not in registry_text:
              raise SystemExit("Could not find SongEventRegistry built-in event loop")
          if registry_guard not in registry_text:
              registry_text = registry_text.replace(registry_anchor, registry_guard, 1)
              registry.write_text(registry_text, encoding="utf-8")

          # This repository is a dedicated Tricky Clowned Out HTML5 build.
          # Force startup to load only this mod.

          handler_script = Path("source/funkin/modding/PolymodHandler.hx")
          handler_script_text = handler_script.read_text(encoding="utf-8")

          # Skip the HTML5 touch-to-play interstitial. We still launch the
          # Tricky boot screen directly so the first visible game state is Tricky.
          init_state = Path("source/funkin/InitState.hx")
          init_text = init_state.read_text(encoding="utf-8")
          init_import = "import funkin.ui.ScriptedMusicBeatState;"
          title_import = "import funkin.ui.title.TitleState;"
          if init_import not in init_text:
              if title_import not in init_text:
                  raise SystemExit("Could not find TitleState import in InitState.hx")
              init_text = init_text.replace(title_import, title_import + "\n" + init_import, 1)

          start_marker = "  function startGameNormally():Void"
          next_doc_marker = "\n  /**\n   * Start the game by directly loading into a specific song."
          start_pos = init_text.find(start_marker)
          if start_pos < 0:
              raise SystemExit("Could not find startGameNormally() in InitState.hx")
          end_pos = init_text.find(next_doc_marker, start_pos)
          if end_pos < 0:
              raise SystemExit("Could not find end of startGameNormally() in InitState.hx")

          start_block = init_text[start_pos:end_pos]
          title_launch = "      FlxG.switchState(() -> new TitleState());"
          launch_pos = start_block.rfind(title_launch)
          if launch_pos < 0:
              raise SystemExit("Could not find final normal TitleState launch in InitState.hx")
          start_block = (
              start_block[:launch_pos]
              + "      FlxG.switchState(() -> ScriptedMusicBeatState.scriptInit('TrickyBootScreenState'));"
              + start_block[launch_pos + len(title_launch):]
          )
          init_text = init_text[:start_pos] + start_block + init_text[end_pos:]
          init_state.write_text(init_text, encoding="utf-8")
          print("Patched normal startup to TrickyBootScreenState.")

          project = Path("project.hxp")
          project_text = project.read_text(encoding="utf-8")

          # This dedicated web build does not use Newgrounds services.
          # Disable the feature before compilation to avoid unused web-only NG classes.
          newgrounds_anchor = "    FEATURE_NEWGROUNDS.apply(this, true);"
          newgrounds_disabled = "    FEATURE_NEWGROUNDS.apply(this, false);"
          if newgrounds_anchor in project_text:
              project_text = project_text.replace(newgrounds_anchor, newgrounds_disabled, 1)
              project.write_text(project_text, encoding="utf-8")
          print("Disabled Newgrounds for the dedicated HTML5 build.")

          # Disable the stock FNF web touch-to-play prompt.
          touch_anchor = "    FEATURE_TOUCH_HERE_TO_PLAY.apply(this, isWeb());"
          touch_disabled = "    FEATURE_TOUCH_HERE_TO_PLAY.apply(this, false);"
          if touch_anchor not in project_text:
              raise SystemExit("Could not find FEATURE_TOUCH_HERE_TO_PLAY configuration")
          if touch_disabled not in project_text:
              project_text = project_text.replace(touch_anchor, touch_disabled, 1)
              project.write_text(project_text, encoding="utf-8")
          print("Disabled the HTML5 touch-to-play prompt.")

          # This dedicated Tricky build does not use the stock base-game song
          # charts. Exclude the one stock chart that is failing from the web
          # preloader so the game can finish initialization instead of aborting
          # on a host-side 503 before the Tricky mod starts.
          web_exclude_anchor = '  static final EXCLUDE_ASSETS_WEB:Array<String> = ["*.ogg"];'
          web_exclude_replacement = '  static final EXCLUDE_ASSETS_WEB:Array<String> = ["*.ogg", "*.mp3", "*.wav", "*.mp4", "*.webm", "data/songs/spookeez/spookeez-chart.json", "images/freeplay/albumRoll/*.xml", "images/freeplay/albumRoll/volume4-text.xml"];'
          if web_exclude_anchor not in project_text:
              raise SystemExit("Could not find EXCLUDE_ASSETS_WEB in project.hxp")
          if web_exclude_replacement not in project_text:
              project_text = project_text.replace(web_exclude_anchor, web_exclude_replacement, 1)
              project.write_text(project_text, encoding="utf-8")
          print("Excluded the failing stock spookeez chart and unused stock Freeplay album-roll XMLs from the HTML5 preloader.")

          handler_script = Path("source/funkin/modding/PolymodHandler.hx")
          handler_script_text = handler_script.read_text(encoding="utf-8")
          async_line = "      loadScriptsAsync: #if html5 true #else false #end,"
          sync_line = "      loadScriptsAsync: false,"
          if async_line not in handler_script_text:
              raise SystemExit("Could not find Polymod loadScriptsAsync setting")
          if sync_line not in handler_script_text:
              handler_script_text = handler_script_text.replace(async_line, sync_line, 1)

          # FNF 0.8.6 runs scripted-class registration inside Polymod.init().
          # Register Tricky's missing state/module scripts again immediately afterward.
          runtime_marker = "    if (loadedModList == null)"
          runtime_lines = [
              "    #if html5",
              "    @:privateAccess",
              "    {",
              "      var registeredClasses:Array<String> = polymod.hscript._internal.PolymodScriptClass.listScriptClasses();",
              "      var trickyScriptPaths:Array<String> = polymod.Polymod.getFileSystem().readDirectoryRecursive('mods/TrickyClownedOut');",
              "      trace('Tricky script candidates from virtual filesystem: ' + trickyScriptPaths.filter(function(p) return p.toLowerCase().contains('scripts/')));",
              "      for (scriptPath in trickyScriptPaths)",
              "      {",
              "        var normalizedPath:String = scriptPath.toLowerCase();",
              "        if (!normalizedPath.endsWith('.hxc') && !normalizedPath.endsWith('.hx')) continue;",
              "        while (normalizedPath.startsWith('/')) normalizedPath = normalizedPath.substring(1);",
              "        if (!normalizedPath.startsWith('scripts/states/') && !normalizedPath.startsWith('scripts/modules/')) continue;",
              "        var fileName:String = normalizedPath.substring(normalizedPath.lastIndexOf('/') + 1);",
              "        var expectedClassName:String = fileName.substring(0, fileName.lastIndexOf('.'));",
              "        if (registeredClasses.indexOf(expectedClassName) == -1)",
              "        {",
              "          trace('Registering missing Tricky script class directly: ' + scriptPath);",
              "          polymod.hscript._internal.PolymodScriptClass.registerScriptClassByPath(scriptPath);",
              "          registeredClasses = polymod.hscript._internal.PolymodScriptClass.listScriptClasses();",
              "        }",
              "      }",
              "      // Direct registration happens after Polymod's initial validation.",
              "      // Re-run import validation so import.hx defaults (including Module)",
              "      // are applied to every script that was registered above.",
              "      polymod.hscript._internal.Interp.validateImports();",
              "      trace('Revalidated Tricky script imports after direct registration.');",
              "      trace('TrickyBootScreenState registered before InitState: ' + (registeredClasses.indexOf('TrickyBootScreenState') != -1));",
              "    }",
              "    #end",
              "",
          ]
          runtime_insertion = chr(10).join(runtime_lines)
          if "TrickyBootScreenState registered before InitState" not in handler_script_text:
              if runtime_marker not in handler_script_text:
                  raise SystemExit("Could not find Polymod loadModsByDir post-init anchor")
              handler_script_text = handler_script_text.replace(runtime_marker, runtime_insertion + runtime_marker, 1)

          handler_script.write_text(handler_script_text, encoding="utf-8")
          print("Made Tricky mod script loading synchronous and added explicit HTML5 registration for missing state/module scripts.")

          main = Path("source/Main.hx")
          main_text = main.read_text(encoding="utf-8")
          main_anchor = "    funkin.modding.PolymodHandler.loadAllMods();"
          main_replacement = "    funkin.modding.PolymodHandler.loadModsByDir(['TrickyClownedOut']);"
          if main_anchor not in main_text:
              raise SystemExit("Could not find Main.hx Polymod startup call")
          if main_replacement not in main_text:
              main_text = main_text.replace(main_anchor, main_replacement, 1)
              main.write_text(main_text, encoding="utf-8")
          print("Forced TrickyClownedOut from Main.hx.")

          # The stock scrollMenu MP3 is unavailable from the v0.8.6 source payload
          # on this HTML5 build and causes a live HTTP 503 when the stock menu tries
          # to play it. Ignore only that one missing web SFX; Tricky has its own menu audio.
          sound = Path("source/funkin/audio/FunkinSound.hx")
          sound_text = sound.read_text(encoding="utf-8")
          sound_anchor = "  public static function playOnce(key:String, volume:Float = 1.0, ?onComplete:Void->Void, ?onLoad:Void->Void, important:Bool = false):Null<FunkinSound>\n  {"
          sound_guard = "  public static function playOnce(key:String, volume:Float = 1.0, ?onComplete:Void->Void, ?onLoad:Void->Void, important:Bool = false):Null<FunkinSound>\n  {\n    #if html5\n    if (key == Paths.sound('scrollMenu')) return null;\n    #end"
          if sound_anchor not in sound_text:
              raise SystemExit("Could not find FunkinSound.playOnce()")
          if sound_guard not in sound_text:
              sound_text = sound_text.replace(sound_anchor, sound_guard, 1)
              sound.write_text(sound_text, encoding="utf-8")
          print("Disabled the missing scrollMenu web SFX request.")
          
          # HTML5 Polymod uses an in-memory ZIP filesystem. Embed the release ZIP
          # as a normal game asset, then inject it into that virtual filesystem.
          project = Path("project.hxp")
          project_text = project.read_text(encoding="utf-8")

          project_anchor = '    addAssetPath("assets/preload", "assets", "default", ["*"], exclude, shouldEmbed, "assets");'
          project_replacement = project_anchor + '\n    addAssetPath("assets/mods", "mods", "default", ["*.zip"], [], true, "assets");'
          if project_anchor not in project_text:
              raise SystemExit("Could not find default asset path in project.hxp")
          if 'addAssetPath("assets/mods", "mods", "default"' not in project_text:
              project_text = project_text.replace(project_anchor, project_replacement, 1)
              project.write_text(project_text, encoding="utf-8")
          print("Added embedded Tricky mod ZIP asset.")

          handler = Path("source/funkin/modding/PolymodHandler.hx")
          handler_text = handler.read_text(encoding="utf-8")
          fs_anchor = "    polymod.Polymod.onError = PolymodErrorHandler.onPolymodError;\n    return new ZipFileSystem({\n      modRoot: MOD_FOLDER,\n      autoScan: true\n    });"
          fs_replacement = "    polymod.Polymod.onError = PolymodErrorHandler.onPolymodError;\n    var fs:polymod.fs.ZipFileSystem = new ZipFileSystem({\n      modRoot: MOD_FOLDER,\n      autoScan: true\n    });\n    #if html5\n    var modZipBytes = funkin.Assets.getBytes('mods/TrickyClownedOut.zip');\n    fs.addZipFile('TrickyClownedOut.zip', modZipBytes);\n    #end\n    return fs;"
          if fs_anchor not in handler_text:
              raise SystemExit("Could not find PolymodHandler.buildFileSystem()")
          if "fs.addZipFile('TrickyClownedOut.zip', modZipBytes);" not in handler_text:
              handler_text = handler_text.replace(fs_anchor, fs_replacement, 1)
              handler.write_text(handler_text, encoding="utf-8")
          print("Injected Tricky mod ZIP into HTML5 Polymod filesystem.")

          # Skip non-fatal unresolved HTML5 compiled classes instead of emitting hundreds of warning traces.
          compiled = Path("source/funkin/util/macro/CompiledClassList.hx")
          compiled_text = compiled.read_text(encoding="utf-8")
          compiled_anchor = "          var classType:Class<Dynamic> = Type.resolveClass(className);\n          classes.push(classType);"
          compiled_guard = "          var classType:Class<Dynamic> = Type.resolveClass(className);\n          if (classType == null)\n          {\n            continue;\n          }\n          classes.push(classType);"
          if compiled_anchor not in compiled_text:
              raise SystemExit("Could not find CompiledClassList resolveClass block")
          if compiled_guard not in compiled_text:
              compiled_text = compiled_text.replace(compiled_anchor, compiled_guard, 1)
              compiled.write_text(compiled_text, encoding="utf-8")
          PY

          grep -n -A8 -B2 "legacy mod scripts" source/funkin/modding/PolymodHandler.hx

      - name: Install Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6

      - name: Prepare Haxelib
        run: |
          set -euo pipefail
          {
            echo "=== Tool versions ==="
            haxe --version
            neko -version || true
            haxelib version
          } | tee "$GITHUB_WORKSPACE/ci-logs/tools-before.txt"

          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib" 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/haxelib-setup.log"

      - name: Install Funkin dependencies
        working-directory: funkin
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/ci-logs/dependencies.log"
          exec > >(tee -a "$LOG") 2>&1

          echo "=== FNF dependency setup ==="
          echo "Haxe: $(haxe --version)"
          echo "Haxelib: $(haxelib version)"
          : > .env

          # Match the Haxe/HMM setup used by the pinned FNF release.
          # FNF v0.8.4 uses haxelib 4.1.0 and the patched "funkin-patches" branches.
          haxelib --never newrepo
          haxelib --debug --never --global install haxelib 4.1.0
          haxelib --global set haxelib 4.1.0
          haxelib --debug --never --global git haxelib https://github.com/FunkinCrew/haxelib.git funkin-patches --skip-dependencies

          # GitHub's package mirror can occasionally return a transient HTTP 502
          # while installing the pinned HMM branch. Retry before failing the build.
          for attempt in 1 2 3 4 5; do
            if haxelib --debug --never --global git hmm https://github.com/FunkinCrew/hmm.git funkin-patches; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Failed to install the pinned HMM branch after 5 attempts."
              exit 1
            fi
            echo "HMM install attempt $attempt failed; retrying in 10 seconds..."
            sleep 10
          done

          test -f hmm.json

          # Install the exact dependency commits pinned by this FNF checkout.
          haxelib --global run hmm install -q

          # Re-pin FlxPartialSound to the exact FNF v0.8.6 lockfile commit.
          # This removes the dependency-version mismatch warning.
          haxelib --debug --never --global git FlxPartialSound https://github.com/FunkinCrew/FlxPartialSound.git 13a0949395250216b9b500ca0731b46841e46085 --skip-dependencies

          haxelib --global list

          echo "=== Verify and patch Lime HTML5 font logging ==="
          LIME_FONT="$(find .haxelib/lime/git -type f -path '*/src/lime/text/Font.hx' -print -quit 2>/dev/null || true)"
          if [ -z "$LIME_FONT" ]; then
            echo "::error::Could not locate Lime's src/lime/text/Font.hx after dependency installation"
            exit 1
          fi
          echo "Lime Font.hx: $LIME_FONT"
          # Funkin's pinned Lime source calls lime.utils.Log from the HTML5
          # font loader but does not import it. Haxe otherwise stops with:
          # "Type not found : Log". Keep this patch local to CI so the
          # upstream dependency remains untouched.
          if ! grep -q '^import lime\.utils\.Log;' "$LIME_FONT"; then
            sed -i '/^import lime\.utils\.Assets;$/a import lime.utils.Log;' "$LIME_FONT"
          fi
          grep -n '^import lime\.utils\.Log;' "$LIME_FONT"

          echo "=== Build HXCPP helper ==="
          if [ -f .haxelib/hxcpp/git/tools/hxcpp/compile.hxml ]; then
            pushd .haxelib/hxcpp/git/tools/hxcpp
            haxe compile.hxml
            popd
          fi

          echo "=== Install Linux native build dependencies ==="
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libgl1-mesa-dev \
            libdrm-dev \
            libgbm-dev \
            libglu1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxss-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols

          command -v wayland-scanner
          wayland-scanner --help >/dev/null

          echo "=== Rebuild pinned Lime native binary ==="
          # HMM intentionally installs Lime from Git, which does not include
          # Lime's prebuilt NDLL. Build the NDLL from the exact pinned source
          # before invoking any Lime command that loads it.
          #
          # Lime documents "lime rebuild cpp" as the advanced path for this
          # situation.
          haxelib run lime rebuild cpp -64

          echo "=== Verify Lime native binary ==="
          LIME_NDLL="$(find .haxelib/lime/git/ndll/Linux64 .haxelib/lime/git/ndll/Linux -type f -name 'lime.ndll' -print -quit 2>/dev/null || true)"
          if [ -z "$LIME_NDLL" ]; then
            echo "::error::Pinned Lime rebuild completed without producing lime.ndll"
            find .haxelib/lime/git/ndll -maxdepth 3 -type f -print 2>/dev/null || true
            exit 1
          fi
          echo "Built matching Lime native binary: $LIME_NDLL"

          echo "=== Lime setup ==="
          haxelib run lime setup

          echo "=== Lime native files ==="
          find .haxelib/lime/git/ndll/Linux64 .haxelib/lime/git/ndll/Linux -maxdepth 1 -type f -printf '%f\n' 2>/dev/null || true

      - name: Install Tricky Clowned Out mod
        run: |
          set -euo pipefail
          mkdir -p funkin/mods funkin/assets/mods
          rm -rf funkin/mods/TrickyClownedOut
          cp -a "$MOD_DIR" funkin/mods/TrickyClownedOut
          test -f funkin/mods/TrickyClownedOut/_polymod_meta.json

          # Polymod warns when a mod has no icon. Add a tiny valid PNG only when absent.
          if [ ! -f funkin/mods/TrickyClownedOut/_polymod_icon.png ]; then
            python3 - <<'PY'
          import base64
          from pathlib import Path
          icon_path = Path("funkin/mods/TrickyClownedOut/_polymod_icon.png")
          icon_bytes = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="
          )
          icon_path.write_bytes(icon_bytes)
          print("Added fallback _polymod_icon.png.")
          PY
          else
            echo "Tricky mod already includes _polymod_icon.png."
          fi

          # The release ZIP contains outer packaging folders. HTML5 Polymod expects
          # the mod's _polymod_meta.json directly at mods/TrickyClownedOut/.
          # Repack only the normalized MOD_DIR contents so the virtual ZIP filesystem
          # exposes the exact path Polymod is asked to load.
          python3 - "$MOD_DIR" "funkin/assets/mods/TrickyClownedOut.zip" <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          mod_dir = Path(sys.argv[1]).resolve()
          out_zip = Path(sys.argv[2]).resolve()

          with zipfile.ZipFile(out_zip, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in mod_dir.rglob("*"):
                  if not path.is_file():
                      continue
                  rel = path.relative_to(mod_dir).as_posix()
                  zf.write(path, rel)

          with zipfile.ZipFile(out_zip) as zf:
              names = set(zf.namelist())
              required = "_polymod_meta.json"
              if required not in names:
                  raise SystemExit(f"Normalized mod ZIP is missing {required}")
              print(f"Normalized mod ZIP contains {len(names)} files.")
              print(f"Metadata path: {required}")
          PY
          test -s funkin/assets/mods/TrickyClownedOut.zip
          unzip -l funkin/assets/mods/TrickyClownedOut.zip | head -n 20

          # Some HTML5 asset loads can bypass Polymod and request this Tricky
          # album title directly from the deployed assets/ directory. Mirror the
          # exact file (plus its matching sprite sheet) when the mod provides it.
          python3 - "$MOD_DIR" <<'PY'
          from pathlib import Path
          import shutil
          import sys

          mod_dir = Path(sys.argv[1]).resolve()
          matches = list(mod_dir.rglob("volume4-text.xml"))
          if matches:
              src = matches[0]
              out_dir = Path("funkin/assets/images/freeplay/albumRoll")
              out_dir.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, out_dir / "volume4-text.xml")
              for sibling in src.parent.glob("volume4-text.*"):
                  if sibling.is_file():
                      shutil.copy2(sibling, out_dir / sibling.name)
                      print(f"Mirrored direct album asset: {sibling.name}")
          else:
              print("No Tricky volume4-text.xml found; no direct album mirror needed.")
          PY

          # Some Lime/OpenFL HTML5 shader loads bypass Polymod's virtual filesystem
          # and request files directly from assets/shaders. Mirror the mod shaders
          # into the core asset tree so those browser requests resolve.
          if [ -d "$MOD_DIR/shaders" ]; then
            mkdir -p funkin/assets/shaders
            cp -a "$MOD_DIR/shaders"/. funkin/assets/shaders/
            echo "Mirrored Tricky shader files:"
            find funkin/assets/shaders -maxdepth 2 -type f -print | sort | head -n 100
          fi
          {
            echo "=== Installed mod ==="
            du -sh funkin/mods/TrickyClownedOut
            find funkin/mods/TrickyClownedOut -maxdepth 2 -type f | head -n 100
          } | tee "$GITHUB_WORKSPACE/ci-logs/mod-installed.txt"

      - name: Verify forced Tricky HTML5 packaging
        working-directory: funkin
        run: |
          set -euo pipefail
          grep -Fn "loadModsByDir(['TrickyClownedOut']);" source/Main.hx
          grep -n 'addAssetPath("assets/mods", "mods", "default"' project.hxp
          grep -n "fs.addZipFile('TrickyClownedOut.zip', modZipBytes);" source/funkin/modding/PolymodHandler.hx
          test -s assets/mods/TrickyClownedOut.zip
          grep -Fn "loadScriptsAsync: false," source/funkin/modding/PolymodHandler.hx
          grep -Fn "FEATURE_TOUCH_HERE_TO_PLAY.apply(this, false);" project.hxp
          grep -Fn "if (key == Paths.sound('scrollMenu')) return null;" source/funkin/audio/FunkinSound.hx
          test -s assets/mods/TrickyClownedOut.zip

      - name: Build HTML5 release
        working-directory: funkin
        run: |
          set -uo pipefail
          LOG="$GITHUB_WORKSPACE/ci-logs/build.log"
          exec > >(tee -a "$LOG") 2>&1
          echo "=== HTML5 build started ==="
          set +e
          haxelib run lime build html5 -final
          status=$?
          echo "=== HTML5 build exit code: $status ==="
          exit "$status"

      - name: Locate HTML5 output
        if: success()
        working-directory: funkin
        run: |
          set -euo pipefail
          # Publish only the generated HTML5 game directory. Never copy
          # README.md or any other repository-root documentation into Pages.
          rm -rf "$GITHUB_WORKSPACE/site"
          mkdir -p "$GITHUB_WORKSPACE/site"

          for candidate in \
            "export/release/html5/bin" \
            "export/release/html5" \
            "export/target/html5/bin"; do
            if [ -f "$candidate/index.html" ]; then
              cp -a "$candidate"/. "$GITHUB_WORKSPACE/site/"
              break
            fi
          done

          if [ ! -f "$GITHUB_WORKSPACE/site/index.html" ]; then
            echo "::error::HTML5 build finished but no index.html was found."
            find export -maxdepth 6 -type f -name index.html -print || true
            exit 1
          fi

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tricky-clowned-out-ci-logs
          path: ci-logs
          if-no-files-found: warn

  website-scan:
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: false
    env:
      SITE_URL: https://clownedoutproject.devs.surf/
      GAME_SITE_URL: https://redev325.github.io/Vs-tricky-clowned-out/
    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium and Playwright
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Scan live HTML5 website
        run: |
          set -u
          mkdir -p website-scan
          node > website-scan/browser-errors.txt <<'NODE'
          const { chromium } = require('playwright');

          const url = process.env.GAME_SITE_URL;
          const customDomainUrl = process.env.SITE_URL;
          let targetAsset = null;

          const consoleMessages = [];
          const allConsoleMessages = [];
          const pageErrors = [];
          const unhandledRejections = [];
          const failedRequests = [];
          const badResponses = [];
          const dialogs = [];

          function errorDetails(value) {
            if (!value) return 'unknown';
            if (value.stack) return value.stack;
            if (value.message) return value.message;
            return String(value);
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--use-gl=swiftshader', '--enable-unsafe-swiftshader']
            });
            const context = await browser.newContext({
              ignoreHTTPSErrors: true
            });

            // Capture browser-level runtime failures as early as possible.
            await context.addInitScript(() => {
              window.addEventListener('error', event => {
                const error = event.error;
                console.error(
                  '[window.error] ' +
                  (error && error.stack ? error.stack : event.message) +
                  ' @ ' + event.filename + ':' + event.lineno + ':' + event.colno
                );
              });

              window.addEventListener('unhandledrejection', event => {
                const reason = event.reason;
                console.error(
                  '[window.unhandledrejection] ' +
                  (reason && reason.stack ? reason.stack : String(reason))
                );
              });
            });

            const page = await context.newPage();

            page.on('console', msg => {
              const location = msg.location();
              const line =
                '[console.' + msg.type() + '] ' + msg.text() +
                (location && location.url
                  ? ' @ ' + location.url + ':' + location.lineNumber + ':' + location.columnNumber
                  : '');

              const text = msg.text();
              const isBrowserWebGLNoise =
                text.includes('Automatic fallback to software WebGL has been deprecated') ||
                (/GL Driver Message/.test(text) && text.includes('ReadPixels'));
              if (text.includes('[window.unhandledrejection]')) {
                unhandledRejections.push(line);
              }

              if ((msg.type() === 'error' || msg.type() === 'warning') && !isBrowserWebGLNoise) {
                consoleMessages.push(line);
              }

              if (!isBrowserWebGLNoise) {
                allConsoleMessages.push(line);
              }
            });

            page.on('pageerror', err => {
              pageErrors.push(
                '[pageerror] ' + errorDetails(err)
              );
            });

            page.on('requestfailed', request => {
              failedRequests.push(
                '[requestfailed] ' + request.method() + ' ' + request.url() +
                ' :: ' + (request.failure()?.errorText || 'unknown')
              );
            });

            page.on('response', response => {
              if (response.status() >= 500) {
                badResponses.push(
                  '[http-' + response.status() + '] ' + response.url()
                );
              }
            });

            page.on('dialog', async dialog => {
              dialogs.push('[dialog.' + dialog.type() + '] ' + dialog.message());
              await dialog.dismiss().catch(() => {});
            });

            try {
              console.log('=== Tricky Clowned Out Website Error Scan ===');
              console.log('GAME URL: ' + url);
              console.log('CUSTOM DOMAIN: ' + customDomainUrl);
              console.log('Started: ' + new Date().toISOString());

              // The Devs.Surf hostname must serve the same game build. Check it
              // separately so a README/DNS mismatch cannot make the game scan
              // falsely report zero runtime errors.
              const domainPage = await context.newPage();
              try {
                const domainResponse = await domainPage.goto(customDomainUrl, {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                });
                const domainTitle = await domainPage.title().catch(() => '');
                const domainText = await domainPage.locator('body').innerText().catch(() => '');
                console.log(
                  'Custom domain HTTP status: ' +
                  (domainResponse ? domainResponse.status() : 'unknown')
                );
                console.log('Custom domain title: ' + domainTitle);
                console.log('Custom domain has HTML5 canvas: ' +
                  String(await domainPage.locator('canvas').count().then(n => n > 0).catch(() => false)));
                const looksLikeReadme =
                  domainTitle === 'Vs-tricky-clowned-out' &&
                  /This mod was build using haxe/i.test(domainText);
                if (looksLikeReadme) {
                  console.log('::error::Custom domain is serving the repository README instead of the HTML5 game.');
                  console.log('Fix the Devs.Surf DNS target so it points to the GitHub Pages site.');
                  process.exitCode = 1;
                }
              } catch (error) {
                console.log('Custom domain check failed: ' + errorDetails(error));
                process.exitCode = 1;
              } finally {
                await domainPage.close().catch(() => {});
              }

              const response = await page.goto(url, {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });

              console.log('HTTP status: ' + (response ? response.status() : 'unknown'));
              console.log('HTML5 canvas count: ' +
                await page.locator('canvas').count().catch(() => 0));
              targetAsset = new URL(
                '/assets/data/songs/bopeebo/bopeebo-metadata-pico.json',
                page.url()
              ).toString();
              const targetModZip = new URL(
                '/mods/TrickyClownedOut.zip',
                page.url()
              ).toString();
              console.log('Resolved same-origin target asset: ' + targetAsset);
              console.log('Resolved same-origin Tricky mod ZIP: ' + targetModZip);

              // Let FNF initialize, load scripts, and execute the mod long enough
              // to catch delayed runtime dialogs.
              await page.waitForTimeout(30000);

              console.log('=== Keyboard interaction test ===');
              const keyboardSequence = [
                'Enter',
                'ArrowDown',
                'ArrowUp',
                'Enter',
                'Escape'
              ];

              for (const key of keyboardSequence) {
                console.log('Pressing ' + key);
                await page.keyboard.press(key).catch(error => {
                  console.log('[keyboard] ' + key + ' failed: ' + errorDetails(error));
                });
                await page.waitForTimeout(750);
              }

              console.log('=== Pointer/touch interaction test ===');
              const viewport = page.viewportSize() || { width: 1280, height: 720 };
              const x = Math.round(viewport.width / 2);
              const y = Math.round(viewport.height / 2);

              await page.mouse.move(x, y);
              await page.mouse.down();
              await page.mouse.up();

              // Dispatch touch-like pointer events against the game canvas/body.
              await page.evaluate(({x, y}) => {
                const target =
                  document.querySelector('canvas') ||
                  document.querySelector('body');

                if (!target) return;

                for (const type of ['pointerover', 'pointerdown', 'pointerup']) {
                  target.dispatchEvent(new PointerEvent(type, {
                    bubbles: true,
                    cancelable: true,
                    pointerId: 1,
                    pointerType: 'touch',
                    isPrimary: true,
                    clientX: x,
                    clientY: y,
                    buttons: type === 'pointerdown' ? 1 : 0
                  }));
                }
              }, {x, y});

              await page.waitForTimeout(5000);

              // Explicitly test the same-origin asset directly from the runner.
              console.log('=== Target asset retry test ===');
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  const result = await context.request.get(
                    targetAsset + '?ci_diagnostic=' + Date.now() + '_' + Math.random(),
                    {
                      timeout: 30000,
                      headers: {'Cache-Control': 'no-cache'}
                    }
                  );

                  let bodyPreview = '';
                  try {
                    bodyPreview = (await result.body()).toString('utf8').slice(0, 300);
                  } catch {}

                  console.log(
                    'Attempt ' + attempt +
                    ': HTTP ' + result.status() + ' ' + result.statusText() +
                    ', content-type=' + result.headers()['content-type'] +
                    ', body-preview=' + JSON.stringify(bodyPreview)
                  );

                  if (result.status() >= 400) {
                    failedRequests.push(
                      '[target-asset-test] HTTP ' + result.status() + ' ' + targetAsset
                    );
                  }
                } catch (error) {
                  const message = errorDetails(error);
                  console.log('Attempt ' + attempt + ': fetch exception: ' + message);
                  failedRequests.push(
                    '[target-asset-test] ' + targetAsset + ' :: ' + message
                  );
                }

                if (attempt < 3) {
                  await page.waitForTimeout(2000);
                }
              }

              console.log('=== Page state ===');
              console.log('Final URL: ' + page.url());
              console.log('Title: ' + await page.title().catch(() => ''));

              console.log('=== Tricky mod ZIP range test ===');
              try {
                const zipResponse = await context.request.get(targetModZip, {
                  timeout: 60000,
                  headers: {
                    Range: 'bytes=0-1',
                    'Cache-Control': 'no-cache'
                  }
                });
                console.log(
                  'Mod ZIP HTTP ' + zipResponse.status() + ' ' + zipResponse.statusText() +
                  ', content-length=' + (zipResponse.headers()['content-length'] || 'unknown') +
                  ', content-range=' + (zipResponse.headers()['content-range'] || 'none') +
                  ', content-type=' + (zipResponse.headers()['content-type'] || 'unknown')
                );
                await zipResponse.body().catch(() => Buffer.alloc(0));
                if (zipResponse.status() >= 400) {
                  failedRequests.push('[mod-zip-test] HTTP ' + zipResponse.status() + ' ' + targetModZip);
                }
              } catch (error) {
                failedRequests.push('[mod-zip-test] ' + targetModZip + ' :: ' + errorDetails(error));
              }

              console.log('=== Counts ===');
              console.log('console errors/warnings: ' + consoleMessages.length);
              console.log('page errors: ' + pageErrors.length);
              console.log('unhandled rejections: ' + unhandledRejections.length);
              console.log('failed requests: ' + failedRequests.length);
              console.log('dialogs: ' + dialogs.length);
              console.log('HTTP 5xx responses: ' + badResponses.length);

              if (dialogs.length) {
                console.log('=== JavaScript dialogs ===');
                dialogs.forEach(x => console.log(x));
              }

              if (pageErrors.length) {
                console.log('=== Page errors with stacks ===');
                pageErrors.forEach(x => console.log(x));
              }

              if (unhandledRejections.length) {
                console.log('=== Unhandled rejections ===');
                unhandledRejections.forEach(x => console.log(x));
              }

              if (consoleMessages.length) {
                console.log('=== Console errors/warnings with locations ===');
                consoleMessages.forEach(x => console.log(x));
              }

              if (allConsoleMessages.length) {
                console.log('=== All browser console messages ===');
                allConsoleMessages.slice(-1000).forEach(x => console.log(x));
              }

              if (failedRequests.length) {
                console.log('=== Failed requests ===');
                failedRequests.forEach(x => console.log(x));
              }

              if (badResponses.length) {
                console.log('=== HTTP 5xx ===');
                badResponses.forEach(x => console.log(x));
              }

              await page.screenshot({
                path: 'website-scan/website.png',
                fullPage: true
              }).catch(() => {});

              if (pageErrors.length || unhandledRejections.length || failedRequests.length ||
                  badResponses.length || consoleMessages.length || dialogs.length) {
                process.exitCode = 1;
              }
            } catch (err) {
              console.log('[scanner] ' + errorDetails(err));
              await page.screenshot({
                path: 'website-scan/website-failure.png',
                fullPage: true
              }).catch(() => {});
            } finally {
              await browser.close();
            }
          })();
          NODE

      - name: Write browser errors to Actions summary
        if: always()
        run: |
          set -u
          {
            echo "## Tricky Clowned Out website scan"
            echo ""
            echo "GAME URL: $GAME_SITE_URL"
            echo "CUSTOM DOMAIN: $SITE_URL"
            echo ""
            cat website-scan/browser-errors.txt
          } >> "$GITHUB_STEP_SUMMARY"

          echo "=== Browser error report ==="
          cat website-scan/browser-errors.txt

      - name: Upload website error report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tricky-clowned-out-website-errors
          path: website-scan
          if-no-files-found: warn

  deploy:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4